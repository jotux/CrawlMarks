<!doctype html>
<!-- Dev only (npm run dev, then /preview.html): the app as a phone and as a desktop, side by side,
     in a light or dark theme picked at the top. Not part of the app. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CrawlMarks preview</title>
<style>
  :root { --bg: #E6E9E5; --ink: #17201B; --frame: #17201B; --btn: #FFFFFF; --on: #0F5C5A; --on-ink: #FFFFFF; color-scheme: light; }
  :root[data-theme='dark'] { --bg: #0C100E; --ink: #E6ECE8; --frame: #3C4843; --btn: #1B2320; --on: #5FB8B2; --on-ink: #0B1715; color-scheme: dark; }
  body { margin: 0; padding: 16px; background: var(--bg); color: var(--ink); font: 13px system-ui, sans-serif; }
  header { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
  .toggle { display: inline-flex; padding: 3px; border-radius: 10px; background: var(--btn); border: 1px solid var(--frame); }
  .toggle button { border: 0; border-radius: 7px; padding: 6px 14px; background: none; color: var(--ink); font: 600 13px system-ui, sans-serif; cursor: pointer; }
  .toggle button[aria-pressed='true'] { background: var(--on); color: var(--on-ink); }
  .plain { padding: 6px 12px; border-radius: 8px; border: 1px solid var(--frame); background: var(--btn); color: var(--ink); font: 600 13px system-ui, sans-serif; cursor: pointer; }
  main { display: flex; gap: 24px; align-items: flex-start; flex-wrap: wrap; }
  figure { margin: 0; display: flex; flex-direction: column; gap: 6px; }
  figcaption { font-weight: 600; }
  iframe { display: block; border: 0; background: var(--bg); }
  .phone iframe { width: 390px; height: 844px; border: 10px solid var(--frame); border-radius: 36px; }
  .desktop { flex: 1; min-width: 600px; }
  .desktop iframe { width: 100%; height: 864px; border: 1px solid var(--frame); border-radius: 8px; }
</style>
</head>
<body>
<header>
  <strong>CrawlMarks preview</strong>
  <div class="toggle" role="group" aria-label="Theme">
    <button type="button" data-theme="light">Light</button>
    <button type="button" data-theme="dark">Dark</button>
  </div>
</header>
<main>
  <figure class="phone"><figcaption>Mobile · 390 × 844</figcaption><iframe data-device="mobile" title="CrawlMarks on a phone"></iframe></figure>
  <figure class="desktop"><figcaption>Desktop</figcaption><iframe data-device="desktop" title="CrawlMarks on a desktop"></iframe></figure>
</main>
<script>
  // starts from the system theme (or the last pick); the frames reload with ?theme= when it changes
  const KEY = 'crawlmarks.preview.theme';
  const system = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  let saved = null;
  try { saved = localStorage.getItem(KEY); } catch {}
  function show(theme) {
    document.documentElement.dataset.theme = theme;
    document.querySelectorAll('.toggle button').forEach((b) => b.setAttribute('aria-pressed', b.dataset.theme === theme));
    document.querySelectorAll('iframe').forEach((f) => { f.src = `/?device=${f.dataset.device}&theme=${theme}`; });
    try { localStorage.setItem(KEY, theme); } catch {}
  }
  document.querySelectorAll('.toggle button').forEach((b) => b.addEventListener('click', () => show(b.dataset.theme)));
  show(saved === 'light' || saved === 'dark' ? saved : system);
</script>
</body>
</html>
